name: CD — Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify release tag matches source
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install and verify the mandatory behavioral sandbox
        run: |
          set -euo pipefail
          sudo apt-get update
          # needrestart would otherwise try to restart unrelated runner services (php-fpm)
          # after the install and block until their systemd timeout; list only.
          sudo env NEEDRESTART_SUSPEND=1 NEEDRESTART_MODE=l apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles

          # Ubuntu's opt-in bwrap profile permits user namespaces while restricting
          # capabilities in its children; keep the system-wide restriction enabled.
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$restriction" && "$(cat "$restriction")" == "1" ]]; then
            sudo apparmor_parser --replace /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          fi

          /usr/bin/bwrap --version
          # Check Runtime's empty-filesystem layout with setup-node's actual binary.
          sandbox_node="$(command -v node)"
          timeout 10s /usr/bin/bwrap --unshare-all --die-with-parent --new-session --cap-drop ALL \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --proc /proc --dev /dev --tmpfs /tmp --ro-bind /etc/hosts /etc/hosts \
            --ro-bind "$(readlink -f "$sandbox_node")" "$sandbox_node" --chdir / \
            -- "$sandbox_node" -e "console.log('Bflow sandbox preflight passed')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Build
        run: |
          pnpm run lint
          pnpm run build

      - name: Unit, integration & E2E gates
        run: |
          pnpm run test
          pnpm run test:e2e

      - name: Package release artifacts
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/release-assets"

          # Pack each @bflow/* workspace package and CLI into tarball assets
          pnpm --filter "./packages/*" --filter "./apps/*" exec pnpm pack --pack-destination "${GITHUB_WORKSPACE}/release-assets"

          # Include every workspace package as the platform grows. Keep only the
          # manifests and compiled output needed by an extracted installation.
          distribution_paths=(
            package.json pnpm-lock.yaml pnpm-workspace.yaml README.md LICENSE
            agents skills templates docs apps/cli/isolation
          )
          for manifest in packages/*/package.json apps/*/package.json; do
            package_dir="${manifest%/package.json}"
            test -d "${package_dir}/dist"
            distribution_paths+=("$manifest" "${package_dir}/dist")
          done
          tar -czf "${GITHUB_WORKSPACE}/release-assets/bflow-${RELEASE_TAG}-dist.tar.gz" \
            "${distribution_paths[@]}"

          # Generate SHA-256 checksums for all release assets
          cd "${GITHUB_WORKSPACE}/release-assets"
          sha256sum * > SHA256SUMS.txt
          ls -lh "${GITHUB_WORKSPACE}/release-assets"

      - name: Smoke test compiled distribution
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf "${GITHUB_WORKSPACE}/release-assets/bflow-${RELEASE_TAG}-dist.tar.gz" -C "$smoke_dir"
          cd "$smoke_dir"
          test -s LICENSE
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
          pnpm install --offline --frozen-lockfile --ignore-scripts
          node apps/cli/dist/bin.js --help
          AI_ISOLATOR_HOME="$smoke_dir/iso-smoke" node apps/cli/dist/bin.js iso help
          python3 -c 'import runpy; runpy.run_path("apps/cli/isolation/lib/mcp_sync.py"); runpy.run_path("apps/cli/isolation/lib/profile_sync.py")'

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "bflow ${{ github.event.inputs.tag || github.ref_name }}"
          generate_release_notes: true
          files: release-assets/*
