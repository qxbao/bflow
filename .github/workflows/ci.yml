name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency graph & type checks (Lint)
        run: pnpm run lint

      - name: Build workspace packages
        run: pnpm run build

      - name: Upload compiled dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            packages/*/dist
            apps/*/dist
            packages/*/*.tsbuildinfo
            apps/*/*.tsbuildinfo
          retention-days: 1

  test-unit:
    name: Unit & Integration Tests (Shard ${{ matrix.shard }}/4)
    needs: lint-and-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install and verify the mandatory behavioral sandbox
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles

          # Ubuntu's opt-in bwrap profile permits user namespaces while restricting
          # capabilities in its children; keep the system-wide restriction enabled.
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$restriction" && "$(cat "$restriction")" == "1" ]]; then
            sudo apparmor_parser --replace /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          fi

          /usr/bin/bwrap --version
          # Check Runtime's empty-filesystem layout with setup-node's actual binary.
          sandbox_node="$(command -v node)"
          timeout 10s /usr/bin/bwrap --unshare-all --die-with-parent --new-session --cap-drop ALL \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --proc /proc --dev /dev --tmpfs /tmp --ro-bind /etc/hosts /etc/hosts \
            --ro-bind "$(readlink -f "$sandbox_node")" "$sandbox_node" --chdir / \
            -- "$sandbox_node" -e "console.log('Bflow sandbox preflight passed')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download compiled dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist

      - name: Ensure workspace build is up-to-date
        run: pnpm run build

      - name: Run Vitest unit & package tests (shard ${{ matrix.shard }}/4)
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

  test-e2e:
    name: E2E Scenarios (Shard ${{ matrix.shard }}/2)
    needs: lint-and-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download compiled dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist

      - name: Ensure workspace build is up-to-date
        run: pnpm run build

      - name: Run Vitest E2E test suite (shard ${{ matrix.shard }}/2)
        run: pnpm exec vitest run --config tests/e2e/vitest.config.ts --shard=${{ matrix.shard }}/2
