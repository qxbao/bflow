name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency graph & type checks (Lint)
        run: pnpm run lint

      - name: Build workspace packages
        run: pnpm run build

      - name: Upload compiled dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            packages/*/dist
            apps/*/dist
            packages/*/*.tsbuildinfo
            apps/*/*.tsbuildinfo
          retention-days: 1

  test-unit:
    name: Unit & Integration Tests (Shard ${{ matrix.shard }}/4)
    needs: lint-and-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download compiled dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist

      - name: Ensure workspace build is up-to-date
        run: pnpm run build

      - name: Run Vitest unit & package tests (shard ${{ matrix.shard }}/4)
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

  test-e2e:
    name: E2E Scenarios (Shard ${{ matrix.shard }}/2)
    needs: lint-and-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download compiled dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist

      - name: Ensure workspace build is up-to-date
        run: pnpm run build

      - name: Run Vitest E2E test suite (shard ${{ matrix.shard }}/2)
        run: pnpm exec vitest run --config tests/e2e/vitest.config.ts --shard=${{ matrix.shard }}/2
